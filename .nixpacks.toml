[phases.setup]
nixPackages = ["php84"]

[phases.install]
cmds = ["composer install --ignore-platform-reqs"]

[phases.build]
cmds = ["composer install --ignore-platform-reqs --optimize-autoloader --no-interaction", "npm install", "npm run build"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"